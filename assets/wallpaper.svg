    <pattern id="fieldRows" width="32" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 16 L16 8 L32 16" fill="none" stroke="#2a762e" stroke-width="2" opacity=".20"/>
    </pattern>
    <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#071c54" opacity=".10"/>
      <rect x="2" y="2" width="2" height="2" fill="#ffffff" opacity=".10"/>
    </pattern>
  </defs>

