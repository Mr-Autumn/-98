      <stop offset="0" stop-color="#0b5db8"/>
      <stop offset="0.46" stop-color="#3b93df"/>
      <stop offset="0.78" stop-color="#8dd8f6"/>
      <stop offset="1" stop-color="#c9eefb"/>
    </linearGradient>
    <pattern id="skyDither" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" x="0" y="0" fill="#ffffff" opacity=".12"/>
      <rect width="1" height="1" x="4" y="4" fill="#0b4f9e" opacity=".10"/>
    </pattern>
